name: N64 diagnostic ROM build (not playable game)

on:
  push:
    branches: [main]
    paths:
      - 'n64/**'
      - 'portable/**'
      - '.github/workflows/n64-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  n64-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      N64_INST: /opt/libdragon
    steps:
      - uses: actions/checkout@v4
      - name: Install official MIPS64 toolchain package
        run: |
          curl --fail --location --retry 3 --output /tmp/n64-toolchain.deb \
            https://github.com/DragonMinded/libdragon/releases/download/toolchain-continuous-prerelease/gcc-toolchain-mips64-amd64.deb
          sudo dpkg -i /tmp/n64-toolchain.deb
          test -x /opt/libdragon/bin/mips64-elf-gcc
      - name: Build and install libdragon SDK
        run: |
          git clone --depth 1 --branch trunk https://github.com/DragonMinded/libdragon.git /tmp/libdragon
          sudo apt-get update
          sudo apt-get install -y libpng-dev zlib1g-dev
          sudo --preserve-env=N64_INST make -C /tmp/libdragon install-mk
          make -C /tmp/libdragon -j 2 libdragon tools
          sudo --preserve-env=N64_INST make -C /tmp/libdragon install tools-install
      - name: Build N64 diagnostic ROM
        run: make -C n64 -j 2
      - name: Verify ROM header (big-endian Z64)
        run: |
          test -s n64/ck64_diag.z64
          python3 - <<'PY'
          from pathlib import Path
          rom = Path('n64/ck64_diag.z64').read_bytes()
          assert rom[:4] == b'\x80\x37\x12\x40', f'Not big-endian z64 header: {rom[:4].hex()}'
          print('Verified N64 ROM magic; byte length:',len(rom))
          PY
      - name: Audit original ROM and create 1 MiB experimental size variant
        run: |
          python3 tools/n64_rom_compat.py n64/ck64_diag.z64 \
            --pad-output n64/ck64_diag_1mib_test.z64
          test "$(stat -c%s n64/ck64_diag_1mib_test.z64)" -eq 1048576
          python3 -m unittest discover -s tools/tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: ck64-diag-n64-rom
          path: |
            n64/ck64_diag.z64
            n64/ck64_diag_1mib_test.z64
          if-no-files-found: error
          retention-days: 14
      - name: Publish versioned Phase 9 diagnostic ROM to GitHub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p roms
          cp n64/ck64_diag.z64 roms/ck64_diag_phase9_clipping.z64
          sha256sum roms/ck64_diag_phase9_clipping.z64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add roms/ck64_diag_phase9_clipping.z64
          if git diff --cached --quiet; then
            echo 'Diagnostic ROM unchanged'
          else
            git commit -m 'build: publish Phase 9 clipping diagnostic ROM'
            git push origin HEAD:main
          fi
